[project]
name = "security-rag"
version = "0.1.0"
description = "A local RAG assistant for OWASP LLM application security knowledge."
readme = "README.md"
authors = [
    { name = "Nikoo Asadnejad", email = "nikoo.a.14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.158.1",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "qdrant-client>=1.19.1",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
security-rag = "security_rag.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
